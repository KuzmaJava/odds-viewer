# Опрос Pinnacle по расписанию и публикация сайта на GitHub Pages.
#
# Cron стартует каждые 15 минут:
#  - бесплатно проверяет список матчей; новый матч сразу снимается со всеми рынками (открытие линии);
#  - лиги опрашиваются по расписанию (раз в 3 ч, за 8 ч до матча — раз в час);
#  - за час до старта снимается реальный двойной шанс (линия закрытия).
# Если ничего не изменилось — ничего не коммитится и не публикуется.
#
# Настройка (один раз):
#   Settings → Secrets and variables → Actions → Secrets:   ODDS_API_KEY
#   Settings → Secrets and variables → Actions → Variables: TRACK_SPORTS (например soccer_epl,soccer_spain_la_liga)
#   Settings → Pages → Source: GitHub Actions
name: Poll Pinnacle

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опросить все лиги прямо сейчас (1 запрос квоты на лигу)"
        type: boolean
        default: false
      sports:
        description: "Новый список лиг через запятую (обычно задаётся с сайта, вкладка «Лиги»). Пусто — без изменений"
        type: string
        default: ""
      lines_now:
        description: "Лиги через запятую: снять все тоталы и форы их матчей сейчас (2 запроса на матч). Пусто — нет"
        type: string
        default: ""
  push:
    branches: [main, master]
    paths: ["static/**", "app/**", "frontend/**", "backend/**", ".github/workflows/poll.yml", "data/state.json"]  # пуши бота сюда не попадают (GITHUB_TOKEN не запускает workflow)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}  # необязательно: по строке на лигу «soccer_epl=ключ»
      # Telegram-алерты (необязательно): без токена бот молчит
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ALERT_MIN_PCT: ${{ vars.ALERT_MIN_PCT || '10' }}            # порог просадки / роста от открытия, %
      ALERT_MARKETS: ${{ vars.ALERT_MARKETS || '1x2,total,spread' }}  # рынки (тоталы и форы — основная линия)
      ALERT_SPORTS: ${{ vars.ALERT_SPORTS || '' }}               # только эти лиги; пусто — все
      TRACK_SPORTS: ${{ vars.TRACK_SPORTS || 'soccer_epl' }}
      POLL_BASE_HOURS: ${{ vars.POLL_BASE_HOURS || '3' }}
      POLL_NEAR_HOURS: ${{ vars.POLL_NEAR_HOURS || '2' }}
      NEAR_KICKOFF_HOURS: ${{ vars.NEAR_KICKOFF_HOURS || '8' }}
      MIN_QUOTA_REMAINING: ${{ vars.MIN_QUOTA_REMAINING || '10' }}
      LEAGUE_MARKETS: ${{ vars.LEAGUE_MARKETS || 'h2h' }}
      LEAGUE_MODE: ${{ vars.LEAGUE_MODE || '1' }}
      # Настройки по лигам (переопределяются переменной LEAGUE_SETTINGS):
      #  клубные лиги — hybrid: П1/X/П2 часто одним запросом на лигу (раз в 12 ч; АПЛ, Ла Лига, Серия А — раз в 24 ч;
      #  за 13 ч до матча — раз в 3 ч) + все нечетвертные тоталы и форы запросом по матчу: открытие, за 24/13/4 ч, закрытие.
      #  Так же — Лига наций, еврокубки (1X2 раз в 24 ч) и любые новые лиги (по «default»).
      LEAGUE_SETTINGS: "${{ vars.LEAGUE_SETTINGS || 'default: hybrid, points 24h 13h 4h, far 12h; soccer_epl: hybrid, points 24h 13h 4h, far 24h; soccer_spain_la_liga: hybrid, points 24h 13h 4h, far 24h; soccer_italy_serie_a: hybrid, points 24h 13h 4h, far 24h; soccer_uefa_champs_league: hybrid, points 24h 13h 4h, far 24h; soccer_uefa_europa_league: hybrid, points 24h 13h 4h, far 24h; soccer_uefa_europa_conference_league: hybrid, points 24h 13h 4h, far 24h' }}"
      LEAGUE_SNAPSHOT_MARKETS: ${{ vars.LEAGUE_SNAPSHOT_MARKETS || 'h2h,totals' }}
      LINES_FAR_HOURS: ${{ vars.LINES_FAR_HOURS || '8' }}
      LINES_NEAR_HOURS: ${{ vars.LINES_NEAR_HOURS || '3' }}
      LINES_NEAR_WINDOW_HOURS: ${{ vars.LINES_NEAR_WINDOW_HOURS || '13' }}
      CLOSE_WINDOW_MIN: ${{ vars.CLOSE_WINDOW_MIN || '60' }}
      DEFAULT_REF: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      # Трекер — на Java 21 (backend/); Python-версия (app/) осталась для локального сервера
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build tracker (Java)
        working-directory: backend
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then ./gradlew --no-daemon -q test installDist; else ./gradlew --no-daemon -q installDist; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build site (React)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          if [ "${{ github.event_name }}" = "push" ]; then npm test; fi
          npm run build

      - name: Poll (or just rebuild the site on push)
        id: run
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          SPORTS_INPUT: ${{ inputs.sports }}
          LINES_NOW: ${{ inputs.lines_now }}
        run: |
          TRACKER=backend/build/install/odds-tracker/bin/odds-tracker
          if [ "$EVENT" = "push" ]; then
            $TRACKER build
          elif [ "$FORCE" = "true" ]; then
            $TRACKER run --force --sports "$SPORTS_INPUT" --lines-now "$LINES_NOW"
          else
            $TRACKER run --sports "$SPORTS_INPUT" --lines-now "$LINES_NOW"
          fi

      - name: Commit state
        if: steps.run.outputs.changed == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet && exit 0
          git commit -m "poll $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.run.outputs.changed == 'true'
        with:
          path: _site

  deploy:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
