<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fde; --best: #1f9d55; --best-bg: #e6f6ec; --warn-bg: #fff4d6; --row-hover: #f1f4fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e3e7ef; --muted: #8b93a7; --line: #2a303c;
      --accent: #6c9cf0; --best: #4fd18b; --best-bg: #173226; --warn-bg: #3a3214; --row-hover: #212633;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0 12px 0 0; }
  label { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
  select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12px; }
  .banner { margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); font-size: 13px; }
  .error { background: #fde2e2; color: #8a1c1c; }
  main { padding: 12px 20px 40px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 900px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
  thead tr:first-child th { border-bottom: none; padding-bottom: 0; color: var(--text); }
  td.match { text-align: left; }
  td.match .teams { font-weight: 600; }
  td.time { color: var(--muted); font-size: 12px; }
  .grp { border-left: 1px solid var(--line); }
  td.odd { font-variant-numeric: tabular-nums; min-width: 52px; }
  td.odd.best { color: var(--best); background: var(--best-bg); font-weight: 600; }
  td.line { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.na { color: var(--muted); }
  .derived { color: var(--muted); font-style: italic; }
  tbody tr.ev:hover { background: var(--row-hover); }
  tr.details td { background: var(--bg); text-align: left; padding: 10px 14px; }
  .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .details-grid h4 { margin: 0 0 6px; font-size: 13px; }
  .mini { border-collapse: collapse; width: 100%; min-width: 0; border: 1px solid var(--line); }
  .mini th, .mini td { padding: 4px 6px; font-size: 12px; }
  .link { color: var(--accent); background: none; border: none; padding: 0; font-size: 12px; }
  .legend { margin: 10px 20px 0; color: var(--muted); font-size: 12px; }
  .legend span { padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Коэффициенты</h1>
  <label>Лига <select id="sport"></select></label>
  <label>Контора <select id="bookmaker"></select></label>
  <label><input type="checkbox" id="autorefresh"> автообновление (2 мин)</label>
  <button id="refresh">Обновить</button>
  <div class="spacer"></div>
  <div class="meta" id="meta"></div>
</header>
<div id="banner"></div>
<div class="legend"><span style="background:var(--best-bg);color:var(--best)">зелёным</span> — лучший коэффициент среди всех контор по матчу · <span class="derived">курсив</span> — двойной шанс рассчитан из 1X2 · ИТ — индивидуальные тоталы (отдельный запрос на матч)</div>
<main>
  <table>
    <thead>
      <tr>
        <th colspan="2"></th>
        <th colspan="4" class="grp">Исход</th>
        <th colspan="3" class="grp">Двойной шанс</th>
        <th colspan="3" class="grp">Тотал</th>
        <th class="grp"></th>
      </tr>
      <tr>
        <th>Время</th><th style="text-align:left">Матч</th>
        <th class="grp">П1</th><th>X</th><th>П2</th><th>маржа</th>
        <th class="grp">1X</th><th>12</th><th>X2</th>
        <th class="grp">линия</th><th>Б</th><th>М</th>
        <th class="grp">ИТ</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="13" class="na">Загрузка…</td></tr></tbody>
  </table>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { events: [], bookmaker: null, extras: {}, open: new Set(), timer: null };

const fmt = (v) => (v == null ? "—" : Number(v).toFixed(2));
const fmtTime = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function api(path) {
  const r = await fetch(path);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

function showBanner(text, isError) {
  $("banner").innerHTML = text ? `<div class="banner ${isError ? "error" : ""}">${text}</div>` : "";
}

function showQuota(q) {
  if (!q || q.remaining == null) return;
  $("meta").textContent = `Квота API: осталось ${q.remaining}, использовано ${q.used}`;
}

// Лучший коэффициент среди всех контор для данного селектора
function bestOf(ev, pick) {
  let best = null;
  for (const bm of ev.bookmakers) {
    const v = pick(bm);
    if (v != null && (best == null || v > best)) best = v;
  }
  return best;
}

function oddCell(ev, bm, pick, cls = "") {
  const v = bm ? pick(bm) : null;
  if (v == null) return `<td class="odd na ${cls}">—</td>`;
  const best = ev.bookmakers.length > 1 && v === bestOf(ev, pick);
  return `<td class="odd ${best ? "best" : ""} ${cls}">${fmt(v)}</td>`;
}

// Тоталы сравниваем только на той же линии, что у выбранной конторы
const totalPick = (point, side) => (b) => {
  const l = (b.totals || []).find((x) => x.point === point);
  return l ? l[side] : null;
};

function renderRow(ev) {
  const bm = ev.bookmakers.find((b) => b.key === state.bookmaker);
  const tm = bm && bm.totals_main;
  const dcCls = bm && bm.double_chance_derived ? "derived" : "";
  const opened = state.open.has(ev.id);
  return `
    <tr class="ev" data-id="${esc(ev.id)}">
      <td class="time">${fmtTime(ev.commence_time)}</td>
      <td class="match"><div class="teams">${esc(ev.home)} — ${esc(ev.away)}</div></td>
      ${oddCell(ev, bm, (b) => b.h2h.home, "grp")}
      ${oddCell(ev, bm, (b) => b.h2h.draw)}
      ${oddCell(ev, bm, (b) => b.h2h.away)}
      <td class="line">${bm && bm.h2h_margin != null ? bm.h2h_margin.toFixed(1) + "%" : "—"}</td>
      ${oddCell(ev, bm, (b) => b.double_chance["1X"], "grp " + dcCls)}
      ${oddCell(ev, bm, (b) => b.double_chance["12"], dcCls)}
      ${oddCell(ev, bm, (b) => b.double_chance["X2"], dcCls)}
      <td class="line grp">${tm ? tm.point : "—"}</td>
      ${tm ? oddCell(ev, bm, totalPick(tm.point, "over")) : '<td class="na">—</td>'}
      ${tm ? oddCell(ev, bm, totalPick(tm.point, "under")) : '<td class="na">—</td>'}
      <td class="grp"><button class="link" data-toggle="${esc(ev.id)}">${opened ? "скрыть" : "показать"}</button></td>
    </tr>
    ${opened ? renderDetails(ev) : ""}`;
}

function linesTable(lines, title) {
  if (!lines || !lines.length) return `<div><h4>${esc(title)}</h4><div class="na">нет данных</div></div>`;
  return `<div><h4>${esc(title)}</h4><table class="mini">
    <tr><th>линия</th><th>Б</th><th>М</th></tr>
    ${lines.map((l) => `<tr><td>${l.point}</td><td>${fmt(l.over)}</td><td>${fmt(l.under)}</td></tr>`).join("")}
  </table></div>`;
}

function renderDetails(ev) {
  const extra = state.extras[ev.id];
  let body;
  if (!extra) body = `<div class="na">Загрузка индивидуальных тоталов…</div>`;
  else if (extra.error) body = `<div class="na">Ошибка: ${esc(extra.error)}</div>`;
  else {
    const bm = extra.bookmakers.find((b) => b.key === state.bookmaker);
    const tt = bm && bm.team_totals;
    const base = ev.bookmakers.find((b) => b.key === state.bookmaker);
    body = !bm
      ? `<div class="na">У выбранной конторы нет доп. рынков по этому матчу</div>`
      : `<div class="details-grid">
          ${linesTable(tt && tt.home.lines, "ИТ1 · " + ev.home)}
          ${linesTable(tt && tt.away.lines, "ИТ2 · " + ev.away)}
          ${linesTable(base && base.totals, "Общий тотал · все линии")}
        </div>`;
  }
  return `<tr class="details"><td colspan="13">${body}</td></tr>`;
}

function render() {
  const rows = $("rows");
  if (!state.events.length) {
    rows.innerHTML = `<tr><td colspan="13" class="na">Нет матчей с коэффициентами</td></tr>`;
    return;
  }
  rows.innerHTML = state.events.map(renderRow).join("");
}

function fillBookmakers(defaultKey) {
  const books = new Map();
  state.events.forEach((e) => e.bookmakers.forEach((b) => books.set(b.key, b.title)));
  const sel = $("bookmaker");
  const prev = state.bookmaker || defaultKey;
  sel.innerHTML = [...books].sort((a, b) => a[1].localeCompare(b[1]))
    .map(([k, t]) => `<option value="${esc(k)}">${esc(t)}</option>`).join("");
  state.bookmaker = books.has(prev) ? prev : (books.keys().next().value || null);
  sel.value = state.bookmaker || "";
}

async function loadExtra(ev) {
  try {
    const data = await api(`/api/odds/${encodeURIComponent(ev.sport_key)}/${encodeURIComponent(ev.id)}/extra`);
    state.extras[ev.id] = data.event;
    showQuota(data.quota);
  } catch (e) {
    state.extras[ev.id] = { error: e.message };
  }
  render();
}

async function loadOdds() {
  const sport = $("sport").value;
  if (!sport) return;
  $("rows").innerHTML = `<tr><td colspan="13" class="na">Загрузка…</td></tr>`;
  try {
    const data = await api(`/api/odds/${encodeURIComponent(sport)}`);
    state.events = data.events.sort((a, b) => a.commence_time.localeCompare(b.commence_time));
    state.extras = {};
    state.open.clear();
    fillBookmakers(window.DEFAULT_BOOKMAKER);
    showQuota(data.quota);
    render();
  } catch (e) {
    showBanner("Ошибка загрузки коэффициентов: " + esc(e.message), true);
    $("rows").innerHTML = "";
  }
}

async function init() {
  try {
    const st = await api("/api/status");
    window.DEFAULT_BOOKMAKER = st.default_bookmaker;
    if (st.demo) showBanner("Демо-режим: ключ ODDS_API_KEY не задан, показаны сгенерированные данные.");
    const sports = await api("/api/sports");
    $("sport").innerHTML = sports.map((s) => `<option value="${esc(s.key)}">${esc(s.title)}</option>`).join("");
    const saved = localStorage.getItem("sport");
    if (saved && sports.some((s) => s.key === saved)) $("sport").value = saved;
    await loadOdds();
  } catch (e) {
    showBanner("Ошибка: " + esc(e.message), true);
  }
}

$("sport").addEventListener("change", () => {
  try { localStorage.setItem("sport", $("sport").value); } catch (_) {}
  state.bookmaker = null;
  loadOdds();
});
$("bookmaker").addEventListener("change", () => { state.bookmaker = $("bookmaker").value; render(); });
$("refresh").addEventListener("click", loadOdds);
$("autorefresh").addEventListener("change", (e) => {
  clearInterval(state.timer);
  if (e.target.checked) state.timer = setInterval(loadOdds, 120000);
});
$("rows").addEventListener("click", (e) => {
  const id = e.target.dataset.toggle;
  if (!id) return;
  if (state.open.has(id)) state.open.delete(id);
  else {
    state.open.add(id);
    const ev = state.events.find((x) => x.id === id);
    if (ev && !state.extras[id]) loadExtra(ev);
  }
  render();
});

init();
</script>
</body>
</html>
