<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinnacle Tracker</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
    --accent: #2f6fde; --drop: #c4352b; --drop-bg: #fdecea; --rise: #1f8a4c; --rise-bg: #e6f6ec;
    --warn-bg: #fff4d6; --row-hover: #f1f4fa;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #e3e7ef; --muted: #8b93a7; --line: #2a303c;
      --accent: #6c9cf0; --drop: #ff7b70; --drop-bg: #3a1d1b; --rise: #4fd18b; --rise-bg: #173226;
      --warn-bg: #3a3214; --row-hover: #212633;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { border: none; background: none; padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 600; }
  nav button.active { background: var(--bg); color: var(--text); }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 12px; }
  select, button, input[type=number] { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
  .banner { margin: 12px 20px 0; padding: 8px 12px; border-radius: 6px; background: var(--warn-bg); font-size: 13px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 10px; }
  main { padding: 14px 20px 40px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: var(--panel); border: 1px solid var(--line); }
  th, td { padding: 7px 9px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  .left { text-align: left; }
  .muted { color: var(--muted); font-size: 12px; }
  .grp { border-left: 1px solid var(--line); }
  .num { font-variant-numeric: tabular-nums; }
  td.odd .cur { font-weight: 600; }
  td.odd .delta { font-size: 11px; }
  .down { color: var(--drop); }
  .up { color: var(--rise); }
  td.odd.down-bg { background: var(--drop-bg); }
  td.odd.up-bg { background: var(--rise-bg); }
  .derived { font-style: italic; }
  tbody tr.ev { cursor: pointer; }
  tbody tr.ev:hover { background: var(--row-hover); }
  tr.details > td { background: var(--bg); text-align: left; padding: 10px 14px; }
  .hist { width: auto; min-width: 520px; }
  .hist td, .hist th { padding: 4px 10px; font-size: 12px; }
  .pct { font-weight: 700; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .leagues { columns: 3 260px; background: var(--panel); border: 1px solid var(--line); padding: 12px; border-radius: 8px; }
  .leagues label { display: flex; color: var(--text); padding: 3px 0; break-inside: avoid; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Pinnacle · движение линии</h1>
  <nav>
    <button data-tab="moves" class="active">Матчи</button>
    <button data-tab="drops">Просадки</button>
    <button data-tab="leagues">Лиги</button>
  </nav>
  <div class="spacer"></div>
  <div class="meta" id="meta"></div>
  <button id="pollNow" title="Внеплановый опрос: 1 запрос квоты на каждую лигу">Опросить сейчас</button>
</header>
<div id="banner"></div>

<main>
  <!-- Матчи -->
  <section id="tab-moves">
    <div class="toolbar">
      <label><input type="checkbox" id="startedMoves"> показывать начавшиеся</label>
      <span class="muted">Значение — текущий коэффициент; под ним — от открытия. Двойной шанс (курсив) рассчитан из 1X2. Клик по матчу — история.</span>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>Начало</th><th class="left">Матч</th><th>Снимков</th>
        <th class="grp">П1</th><th>X</th><th>П2</th>
        <th class="grp">1X</th><th>12</th><th>X2</th>
      </tr></thead>
      <tbody id="moveRows"></tbody>
    </table></div>
  </section>

  <!-- Просадки -->
  <section id="tab-drops" hidden>
    <div class="toolbar">
      <label>Просадка от <input type="number" id="minPct" value="3" min="0" step="0.5" style="width:70px"> %</label>
      <label><input type="checkbox" id="startedDrops"> включая начавшиеся</label>
      <label><input type="checkbox" id="onlyMain"> только П1 / X / П2</label>
    </div>
    <div class="scroll"><table>
      <thead><tr>
        <th>Δ</th><th>Исход</th><th class="left">Матч</th><th>Начало</th>
        <th class="grp">Открытие</th><th>Сейчас</th><th class="grp">Отслеживается</th>
      </tr></thead>
      <tbody id="dropRows"></tbody>
    </table></div>
  </section>

  <!-- Лиги -->
  <section id="tab-leagues" hidden>
    <div class="toolbar">
      <button id="saveLeagues">Сохранить</button>
      <span class="muted" id="estimate"></span>
    </div>
    <p class="muted" id="staticHint"></p>
    <div class="leagues" id="leagueList">Загрузка…</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { status: null, events: [], open: new Set(), history: {}, tab: "moves" };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v) => (v == null ? "—" : Number(v).toFixed(2));
const fmtPct = (v) => (v == null ? "" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1) + "%");
const fmtDT = (iso) => {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " +
         d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
};
const fmtT = (iso) => (iso ? new Date(iso).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : "—");

// ---------- источник данных ----------
// Статический режим (GitHub Pages): рядом со страницей лежит data.json, собранный GitHub Actions.
// Серверный режим (локально, uvicorn): данные отдаёт FastAPI по /api/...
let STATIC = null;

async function loadStaticData() {
  try {
    const r = await fetch("data.json", { cache: "no-cache" });
    if (r.ok) STATIC = await r.json();
  } catch (_) { /* не статический режим */ }
}

function staticDrops(events, minPct) {
  const res = [];
  for (const ev of events) for (const o of ev.outcomes) {
    if (o.change_pct != null && o.change_pct <= -Math.abs(minPct)) {
      res.push({ event_id: ev.id, sport_title: ev.sport_title, home: ev.home, away: ev.away,
        commence_time: ev.commence_time, snapshots: ev.snapshots, first_ts: ev.first_ts, last_ts: ev.last_ts, ...o });
    }
  }
  return res.sort((a, b) => a.change_pct - b.change_pct);
}

function staticApi(path, opts) {
  if (opts && opts.method && opts.method !== "GET") throw new Error("Недоступно в статической версии");
  const url = new URL(path, location.href);
  const p = url.pathname.replace(/^.*\/api\//, "/api/");
  const started = url.searchParams.get("include_started") === "true";
  const now = new Date().toISOString();
  const events = STATIC.events.filter((e) => started || e.commence_time > now);
  if (p === "/api/status") return STATIC.status;
  if (p === "/api/events") return events;
  if (p === "/api/drops") return staticDrops(events, parseFloat(url.searchParams.get("min_pct")) || 0);
  if (p === "/api/sports") return STATIC.sports || [];
  const m = p.match(/^\/api\/events\/(.+)\/history$/);
  if (m) return { history: STATIC.history[decodeURIComponent(m[1])] || [] };
  throw new Error("Неизвестный путь " + p);
}

async function api(path, opts) {
  if (STATIC) return staticApi(path, opts);
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}

function banner(html) { $("banner").innerHTML = html ? `<div class="banner">${html}</div>` : ""; }

// ---------- статус ----------
async function loadStatus() {
  const st = state.status = await api("/api/status");
  const q = st.quota && st.quota.remaining != null ? ` · квота: осталось ${st.quota.remaining}` : "";
  const p = st.policy;
  const near = st.schedule.filter((s) => s.interval_hours === p.near_hours).length;
  $("meta").textContent =
    `Лиг: ${st.tracked_sports.length} · раз в ${p.base_hours} ч, за ${p.near_window_hours} ч до матча — раз в ${p.near_hours} ч` +
    (near ? ` (сейчас часто: ${near})` : "") +
    ` · последний опрос ${fmtDT(st.last_poll_at)} · следующий ${fmtDT(st.next_poll_at)}${q}`;
  if (STATIC) $("meta").textContent += ` · данные собраны ${fmtDT(STATIC.generated_at)}`;
  const msgs = [];
  if (st.demo && !STATIC) msgs.push("Демо-режим: ключ ODDS_API_KEY не задан — коэффициенты не меняются.");
  if (st.last_error) msgs.push("Ошибка последнего опроса: " + esc(st.last_error));
  banner(msgs.join("<br>"));
}

// ---------- матчи ----------
function oddCell(o, first) {
  const ch = o.change_pct;
  const dir = ch == null || ch === 0 ? "" : ch < 0 ? "down" : "up";
  const bg = ch != null && Math.abs(ch) >= 3 ? ` ${dir}-bg` : "";
  const delta = ch ? `<div class="delta ${dir}">${fmt(o.opening)} · ${fmtPct(ch)}</div>` : `<div class="delta muted">без изменений</div>`;
  return `<td class="odd num ${first ? "grp" : ""}${bg} ${o.derived ? "derived" : ""}" title="Открытие ${fmt(o.opening)} → сейчас ${fmt(o.current)}">
    <div class="cur">${fmt(o.current)}</div>${delta}</td>`;
}

function historyTable(id) {
  const h = state.history[id];
  if (!h) return `<span class="muted">Загрузка…</span>`;
  if (h.error) return `<span class="muted">Ошибка: ${esc(h.error)}</span>`;
  return `<table class="hist"><thead><tr><th>Снимок</th><th>П1</th><th>X</th><th>П2</th><th>1X</th><th>12</th><th>X2</th></tr></thead><tbody>
    ${h.map((r) => {
      const dc = (a, b) => (a && b ? 1 / (1 / a + 1 / b) : null);
      return `<tr><td>${fmtDT(r.ts)}</td><td class="num">${fmt(r.home)}</td><td class="num">${fmt(r.draw)}</td><td class="num">${fmt(r.away)}</td>
        <td class="num derived">${fmt(dc(r.home, r.draw))}</td><td class="num derived">${fmt(dc(r.home, r.away))}</td><td class="num derived">${fmt(dc(r.draw, r.away))}</td></tr>`;
    }).join("")}</tbody></table>`;
}

function renderMoves() {
  if (!state.events.length) {
    $("moveRows").innerHTML = `<tr><td colspan="9" class="empty">Пока нет данных. Выберите лиги на вкладке «Лиги» и нажмите «Опросить сейчас» или дождитесь планового опроса.</td></tr>`;
    return;
  }
  $("moveRows").innerHTML = state.events.map((ev) => `
    <tr class="ev" data-id="${esc(ev.id)}">
      <td class="muted">${fmtDT(ev.commence_time)}</td>
      <td class="left"><b>${esc(ev.home)} — ${esc(ev.away)}</b><div class="muted">${esc(ev.sport_title)}</div></td>
      <td class="muted">${ev.snapshots}<div>с ${fmtDT(ev.first_ts)}</div></td>
      ${ev.outcomes.map((o, i) => oddCell(o, i === 0 || i === 3)).join("")}
    </tr>
    ${state.open.has(ev.id) ? `<tr class="details"><td colspan="9">${historyTable(ev.id)}</td></tr>` : ""}`).join("");
}

async function loadMoves() {
  state.events = await api(`/api/events?include_started=${$("startedMoves").checked}`);
  renderMoves();
}

async function toggleHistory(id) {
  if (state.open.has(id)) { state.open.delete(id); renderMoves(); return; }
  state.open.add(id);
  renderMoves();
  try { state.history[id] = (await api(`/api/events/${encodeURIComponent(id)}/history`)).history; }
  catch (e) { state.history[id] = { error: e.message }; }
  renderMoves();
}

// ---------- просадки ----------
async function loadDrops() {
  const min = parseFloat($("minPct").value) || 0;
  let rows = await api(`/api/drops?min_pct=${min}&include_started=${$("startedDrops").checked}`);
  if ($("onlyMain").checked) rows = rows.filter((r) => !r.derived);
  $("dropRows").innerHTML = rows.length ? rows.map((r) => `
    <tr>
      <td class="pct down num">${fmtPct(r.change_pct)}</td>
      <td class="${r.derived ? "derived" : ""}"><b>${esc(r.label)}</b></td>
      <td class="left"><b>${esc(r.home)} — ${esc(r.away)}</b><div class="muted">${esc(r.sport_title)}</div></td>
      <td class="muted">${fmtDT(r.commence_time)}</td>
      <td class="num grp">${fmt(r.opening)}</td>
      <td class="num down"><b>${fmt(r.current)}</b></td>
      <td class="muted grp">с ${fmtDT(r.first_ts)} · ${r.snapshots} сн.</td>
    </tr>`).join("")
    : `<tr><td colspan="7" class="empty">Просадок от ${min}% нет</td></tr>`;
}

// ---------- лиги ----------
function updateEstimate() {
  const n = document.querySelectorAll("#leagueList input:checked").length;
  const p = state.status?.policy || { base_hours: 3, near_hours: 1 };
  const min = Math.round((24 / p.base_hours) * 30);   // ни одного матча весь месяц
  const max = Math.round((24 / p.near_hours) * 30);   // матчи в окне постоянно
  $("estimate").textContent =
    `Выбрано лиг: ${n} → ≈ ${n * min}–${n * max} запр./мес, для лиги с матчами по выходным обычно ≈ ${n * Math.round(min * 1.5)} (бесплатный план — 500/мес)`;
}

async function loadLeagues() {
  const sports = await api("/api/sports");
  const tracked = new Set(state.status.tracked_sports);
  $("leagueList").innerHTML = sports.sort((a, b) => a.title.localeCompare(b.title)).map((s) =>
    `<label><input type="checkbox" value="${esc(s.key)}" ${tracked.has(s.key) ? "checked" : ""}> ${esc(s.title)}</label>`).join("");
  updateEstimate();
}

$("leagueList").addEventListener("change", updateEstimate);
$("saveLeagues").addEventListener("click", async () => {
  const sports = [...document.querySelectorAll("#leagueList input:checked")].map((i) => i.value);
  if (STATIC) {
    // На GitHub Pages сохранять некуда: список лиг — переменная репозитория TRACK_SPORTS
    const value = sports.join(",");
    try { await navigator.clipboard.writeText(value); } catch (_) {}
    const link = STATIC.repo ? `https://github.com/${STATIC.repo}/settings/variables/actions` : null;
    $("staticHint").innerHTML = `Скопировано: <code>${esc(value)}</code>. Вставьте это значение в переменную <b>TRACK_SPORTS</b>` +
      (link ? ` (<a href="${link}" target="_blank" rel="noopener">настройки репозитория → Variables</a>)` : "") +
      ". Изменения вступят в силу со следующего запуска.";
    return;
  }
  await api("/api/tracked", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sports }) });
  await loadStatus();
  $("saveLeagues").textContent = "Сохранено ✓";
  setTimeout(() => ($("saveLeagues").textContent = "Сохранить"), 1500);
});

// ---------- общее ----------
async function refresh() {
  try {
    if (STATIC) await loadStaticData();
    await loadStatus();
    if (state.tab === "moves") await loadMoves();
    if (state.tab === "drops") await loadDrops();
  } catch (e) { banner("Ошибка: " + esc(e.message)); }
}

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  ["moves", "drops", "leagues"].forEach((t) => ($("tab-" + t).hidden = t !== tab));
  try { localStorage.setItem("tab", tab); } catch (_) {}
  if (tab === "leagues") loadLeagues().catch((e) => banner("Ошибка: " + esc(e.message)));
  else refresh();
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));
$("moveRows").addEventListener("click", (e) => { const tr = e.target.closest("tr.ev"); if (tr) toggleHistory(tr.dataset.id); });
$("startedMoves").addEventListener("change", loadMoves);
["minPct", "startedDrops", "onlyMain"].forEach((id) => $(id).addEventListener("change", loadDrops));
$("pollNow").addEventListener("click", async () => {
  if (STATIC) return; // в статическом режиме кнопка открывает GitHub (см. ниже)
  const btn = $("pollNow");
  btn.disabled = true; btn.textContent = "Опрашиваю…";
  try { await api("/api/poll", { method: "POST" }); state.history = {}; await refresh(); }
  catch (e) { banner("Ошибка опроса: " + esc(e.message)); }
  finally { btn.disabled = false; btn.textContent = "Опросить сейчас"; }
});

(async () => {
  await loadStaticData();
  if (STATIC) {
    // Опрос делает GitHub Actions — кнопка ведёт на ручной запуск workflow
    const btn = $("pollNow");
    if (STATIC.repo) {
      btn.textContent = "Запустить опрос в GitHub";
      btn.onclick = () => window.open(`https://github.com/${STATIC.repo}/actions/workflows/poll.yml`, "_blank", "noopener");
    } else btn.hidden = true;
    $("saveLeagues").textContent = "Скопировать список для TRACK_SPORTS";
  }
  await loadStatus().catch((e) => banner("Ошибка: " + esc(e.message)));
  let saved = null;
  try { saved = localStorage.getItem("tab"); } catch (_) {}
  setTab(["moves", "drops", "leagues"].includes(saved) ? saved : "moves");
  setInterval(() => { if (state.tab !== "leagues") refresh(); }, 60000); // из БД, квоту не тратит
})();
</script>
</body>
</html>
